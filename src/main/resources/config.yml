# Skin applied to every civilian (Mojang username). Cached after first fetch.
skin-username: DirtyCivilian

# Spoken lines are instant personality text. Ollama is not on the first line
# anymore — waiting on the model made talk late and then repeat itself.
llm:
  endpoint: http://127.0.0.1:11434/api/chat
  model: phi3:mini
  timeout-ms: 1200
  max-tokens: 40
  temperature: 0.9

civilian:
  health: 16
  walk-speed: 0.11
  wander-min: 4
  wander-max: 11
  idle-ticks-min: 50
  idle-ticks-max: 180
  aim-range: 42
  aim-dot: 0.92
  talk-cooldown-ms: 8000
  pistols:
    - m9
    - usp45
    - warz_m1911
    - warz_fiveseven
    - warz_deserteagle
    - python
    - magnum
    - deserteagle

corpses:
  lifetime-seconds: 180
