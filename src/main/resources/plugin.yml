name: npcs
version: 1.1.1
main: net.minenite.npcs.NpcsPlugin
api-version: '1.21'
author: icedmoca
description: WarZ civilians — cognition layer over a deterministic body.
softdepend: [WarzPlugin, ServerPlugin]

commands:
  npc:
    description: Spawn and manage civilian NPCs.
    usage: /npc spawn civilian | /npc remove [near|all] | /npc list | /npc debug | /npc test
    aliases: [npcs]
    permission: npcs.admin

permissions:
  npcs.admin:
    description: Spawn and remove civilian NPCs.
    default: op
