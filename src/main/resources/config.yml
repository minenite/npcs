# Skin applied to every civilian (Mojang username). Cached after first fetch.
skin-username: DirtyCivilian

# Local Ollama writes every line. Memory + what they can see goes into the prompt.
# llama3.1:8b is the conversational model on this machine.
llm:
  enabled: true
  endpoint: http://127.0.0.1:11434/api/chat
  model: llama3.1:8b
  timeout-ms: 8000
  max-tokens: 70
  temperature: 0.88

civilian:
  health: 16
  walk-speed: 0.20
  wander-min: 4
  wander-max: 11
  idle-ticks-min: 35
  idle-ticks-max: 140
  aim-range: 48
  aim-dot: 0.86
  talk-cooldown-ms: 2200
  pistols:
    - m9
    - usp45
    - warz_m1911
    - warz_fiveseven
    - warz_deserteagle
    - python
    - magnum
    - deserteagle

# Higher-level cognition. Combat/movement stay deterministic.
cognition:
  slow-llm: true
  offscreen-range: 96

corpses:
  lifetime-seconds: 180
