name: npcs
version: 1.0.4
main: net.minenite.npcs.NpcsPlugin
api-version: '1.21'
author: icedmoca
description: WarZ civilian player-NPCs — draw, ADS, talk, die, drop corpses.
softdepend: [WarzPlugin, ServerPlugin]

commands:
  npc:
    description: Spawn and manage civilian NPCs.
    usage: /npc spawn civilian | /npc remove [near|all] | /npc list
    aliases: [npcs]
    permission: npcs.admin

permissions:
  npcs.admin:
    description: Spawn and remove civilian NPCs.
    default: op
